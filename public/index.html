<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Recommender | Find Your Perfect Travel Destination</title>
    
    <!-- Favicon - Comprehensive Approach -->
    <link rel="icon" href="/favicon.ico" sizes="any"><!-- Legacy browsers -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml"><!-- Modern browsers -->
    <link rel="icon" href="/favicon-32x32.svg" type="image/svg+xml" sizes="32x32">
    <link rel="icon" href="/favicon-16x16.svg" type="image/svg+xml" sizes="16x16">
    <link rel="apple-touch-icon" href="/favicon-192x192.svg">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#0066cc">
    
    <!-- SEO Meta Tags -->
    <meta name="description" content="Discover personalized travel recommendations based on your preferences. Find the perfect destination for your next adventure with expert advice and travel guides.">
    <meta name="keywords" content="travel recommendations, vacation planner, travel destinations, trip planning, vacation ideas, travel guide">
    <meta name="author" content="Travel Recommender">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://travelrecommender.com">
    
    <!-- Social Media / OpenGraph Tags -->
    <meta property="og:title" content="Travel Recommender | Find Your Perfect Destination">
    <meta property="og:description" content="Discover personalized travel recommendations based on your preferences and find your next perfect vacation spot.">
    <meta property="og:image" content="https://travelrecommender.com/og-image.jpg">
    <meta property="og:url" content="https://travelrecommender.com">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Travel Recommender">
    
    <!-- Twitter Card Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Travel Recommender | Find Your Perfect Destination">
    <meta name="twitter:description" content="Discover personalized travel recommendations based on your preferences.">
    <meta name="twitter:image" content="https://travelrecommender.com/twitter-card.jpg">
    <meta name="twitter:site" content="@travelrecommend">
    
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Travel Recommender">
    
    <!-- Preconnect to External Resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "TravelAgency",
      "name": "Travel Recommender",
      "url": "https://travelrecommender.com",
      "logo": "https://travelrecommender.com/logo.png",
      "description": "Personalized travel recommendations based on your preferences.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "US"
      },
      "sameAs": [
        "https://facebook.com/travel-recommender",
        "https://twitter.com/travelrecommend",
        "https://instagram.com/travel_recommender",
        "https://pinterest.com/travelrecommender"
      ],
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://travelrecommender.com/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- Start Single Page Apps for GitHub Pages -->
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <!-- End Single Page Apps for GitHub Pages -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Noscript fallback content -->
    <noscript>
      <div style="padding: 2rem; text-align: center; font-family: system-ui, -apple-system, sans-serif;">
        <h1>JavaScript Required</h1>
        <p>Please enable JavaScript to use Travel Recommender and discover your perfect destination.</p>
      </div>
    </noscript>
  </body>
</html>
